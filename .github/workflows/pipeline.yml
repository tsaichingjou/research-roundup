# The Research Roundup — scheduled pipeline
#
#   Daily   (05:23 UTC):           fetch new papers, recover abstracts, score them, refresh
#                                  the dashboard (incl. the provisional picks of the month in progress)
#   Day before (4th): the daily runs also draft the write-ups of last month's provisional picks
#   Monthly (5th, 00:17 UTC):      fetch, select 5-8 papers from the month that just ended,
#                                  write them up, publish the issue
#
# Each run commits its database (data/published.db) and the built site (docs/)
# back to the repository, then deploys docs/ to GitHub Pages.
# Secrets: GEMINI_API_KEY (required), OPENALEX_API_KEY (optional, raises OpenAlex's budget).

name: Research Roundup pipeline

on:
  schedule:
    - cron: "23 5 * * *"     # daily screening
    - cron: "47 17 * * *"    # second daily run, as a backup: GitHub has started scheduled runs
                             # 7-8 hours late and may skip one; reruns are safe (nothing is
                             # fetched, scored or published twice)
    - cron: "17 0 5 * *"     # monthly issue (5th: lets late-indexed papers into their month).
                             # Early because GitHub starts scheduled runs 7-8 hours late, so the
                             # issue is ready on the morning of the 5th; the write-ups were
                             # drafted on the 4th, so few calls to the stronger model are left.
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = fetch and score; monthly = fetch, write up and publish last month's issue; republish = retry missing abstracts and rewrite last month's issue; evaluate = two-model agreement check on the classification"
        type: choice
        options: [daily, monthly, republish, evaluate]
        default: monthly

concurrency:
  group: research-roundup-pipeline     # never two runs writing the database at once
  cancel-in-progress: false

env:
  RR_DATABASE_PATH: data/published.db
  RR_SITE_DIR: docs
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write        # the monthly LLM quality report is posted as an issue
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::The GEMINI_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          [ -n "$OPENALEX_API_KEY" ] || echo "::notice::OPENALEX_API_KEY not set: OpenAlex runs on its smaller anonymous budget."

      - name: Decide daily or monthly
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 0 5 * *" ]; then
            echo "mode=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new papers and recover missing abstracts
        id: fetch
        run: python main.py fetch

      - name: Daily — score new papers
        id: daily
        if: steps.mode.outputs.mode == 'daily'
        run: |
          python main.py screen
          # Safety net for the monthly run (delayed or skipped by GitHub, or written by a
          # fallback model): from the 5th to the 8th, (re)make last month's issue if needed.
          python main.py catch-up || echo "::warning::Catch-up failed; it is retried tomorrow."
          # The day before the publish day: draft the write-ups of last month's picks.
          python main.py draft || echo "::warning::Drafting failed; the issue run writes them instead."
          python main.py quality-report      # only writes when the issue was (re)made
          python main.py build

      - name: Monthly — select, write up and publish the issue
        id: monthly
        if: steps.mode.outputs.mode == 'monthly'
        run: |
          python main.py publish
          python main.py quality-report

      - name: Republish — retry missing abstracts, rewrite last month's issue
        id: republish
        if: steps.mode.outputs.mode == 'republish'
        run: |
          python main.py enrich --retry-all
          python main.py publish --rewrite
          python main.py quality-report

      - name: Evaluate — second model re-labels a sample, agreement report
        id: evaluate
        if: steps.mode.outputs.mode == 'evaluate'
        run: |
          python main.py agreement
          python main.py build

      # Daily health check: problems that need a person (API key rejected, papers
      # unscored for 2+ days, a source failing 3 runs in a row, last month's issue
      # still not right after the catch-up window). One issue per problem, emailed
      # by GitHub; not repeated while open; closed automatically once resolved.
      - name: Health check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python main.py health || exit 0
          [ -f health-alerts.json ] || exit 0
          open=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                 --jq '[.[] | select(.title | startswith("Agent health:")) | {number, title}]')
          jq -c '.[]' health-alerts.json | while read -r alert; do
            title=$(jq -r .title <<<"$alert")
            if ! jq -e --arg t "$title" 'any(.[]; .title == $t)' <<<"$open" >/dev/null; then
              { jq -r .body <<<"$alert"; printf '\n\ncc @%s\n' "$GITHUB_REPOSITORY_OWNER"; } > alert.md
              gh issue create --title "$title" --body-file alert.md
            fi
          done
          jq -c '.[]' <<<"$open" | while read -r issue; do
            title=$(jq -r .title <<<"$issue")
            if ! jq -e --arg t "$title" 'any(.[]; .title == $t)' health-alerts.json >/dev/null; then
              gh issue close "$(jq -r .number <<<"$issue")" \
                --comment "Resolved: the latest run no longer finds this problem."
            fi
          done

      # The monthly LLM quality report (and any regression alert) is posted as a GitHub
      # issue: GitHub emails it to the repository owner. One issue per month; a remade
      # issue adds a comment to it.
      - name: Post quality report
        if: always() && hashFiles('quality-post.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat quality-post-title.txt)"
          num=$(gh issue list --state all --limit 100 --json number,title \
                --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file quality-post.md
          else
            gh issue create --title "$title" --body-file quality-post.md
          fi

      # Save whatever was fetched even if a later step failed, so no work is lost.
      - name: Commit database and site
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "research-roundup-bot"
          git config user.email "research-roundup-bot@users.noreply.github.com"
          git add -f data/published.db
          [ -d docs ] && git add -f docs
          [ -d evaluation ] && git add -f evaluation
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Pipeline: ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
