# The Research Roundup — scheduled pipeline
#
#   Daily   (05:23 UTC):           fetch new papers, recover abstracts, score them, refresh
#                                  the dashboard (incl. the provisional picks of the month in progress)
#   Monthly (5th, 10:17 UTC):      fetch, select 5-8 papers from the month that just ended,
#                                  write them up, publish the issue
#
# Each run commits its database (data/published.db) and the built site (docs/)
# back to the repository, then deploys docs/ to GitHub Pages.
# Secrets: GEMINI_API_KEY (required), OPENALEX_API_KEY (optional, raises OpenAlex's budget).

name: Research Roundup pipeline

on:
  schedule:
    - cron: "23 5 * * *"     # daily screening
    - cron: "17 10 5 * *"    # monthly issue (5th: lets late-indexed papers into their month;
                             # 10:17 UTC: after the Gemini free-tier daily quota resets at 08:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = fetch and score; monthly = fetch, write up and publish last month's issue; republish = retry missing abstracts and rewrite last month's issue; evaluate = two-model agreement check on the classification"
        type: choice
        options: [daily, monthly, republish, evaluate]
        default: monthly

concurrency:
  group: research-roundup-pipeline     # never two runs writing the database at once
  cancel-in-progress: false

env:
  RR_DATABASE_PATH: data/published.db
  RR_SITE_DIR: docs
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::The GEMINI_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          [ -n "$OPENALEX_API_KEY" ] || echo "::notice::OPENALEX_API_KEY not set: OpenAlex runs on its smaller anonymous budget."

      - name: Decide daily or monthly
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 10 5 * *" ]; then
            echo "mode=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new papers and recover missing abstracts
        id: fetch
        run: python main.py fetch

      - name: Daily — score new papers
        id: daily
        if: steps.mode.outputs.mode == 'daily'
        run: |
          python main.py screen
          # Safety net for the monthly run (delayed or skipped by GitHub, or written by a
          # fallback model): from the 5th to the 8th, (re)make last month's issue if needed.
          python main.py catch-up || echo "::warning::Catch-up failed; it is retried tomorrow."
          python main.py build

      - name: Monthly — select, write up and publish the issue
        id: monthly
        if: steps.mode.outputs.mode == 'monthly'
        run: python main.py publish

      - name: Republish — retry missing abstracts, rewrite last month's issue
        id: republish
        if: steps.mode.outputs.mode == 'republish'
        run: |
          python main.py enrich --retry-all
          python main.py publish --rewrite

      - name: Evaluate — second model re-labels a sample, agreement report
        id: evaluate
        if: steps.mode.outputs.mode == 'evaluate'
        run: |
          python main.py agreement
          python main.py build

      # Save whatever was fetched even if a later step failed, so no work is lost.
      - name: Commit database and site
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "research-roundup-bot"
          git config user.email "research-roundup-bot@users.noreply.github.com"
          git add -f data/published.db
          [ -d docs ] && git add -f docs
          [ -d evaluation ] && git add -f evaluation
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Pipeline: ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
