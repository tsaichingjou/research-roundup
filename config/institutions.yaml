# =============================================================================
# Central banks and institutions reached through aggregated feeds
# -----------------------------------------------------------------------------
# The BIS Central Bank Research Hub publishes, in one feed, new research from
# dozens of central banks; each item links to the paper on the issuing bank's
# own website. A paper is attributed to the institution whose domain matches
# that link (or, failing that, whose RePEc archive code appears in it).
#
# group: how the institution is presented in the newsletter and explorer.
# =============================================================================

institutions:
  # --- G10 central banks and the ECB ----------------------------------------
  # (The Federal Reserve Board, the US member of the G10, is fetched directly
  #  from Fed in Print together with the 12 regional banks.)
  - {id: ecb, name: European Central Bank, group: G10 central banks and ECB, domains: [ecb.europa.eu], repec: [ecb]}
  - {id: boj, name: Bank of Japan, group: G10 central banks and ECB, domains: [boj.or.jp]}
