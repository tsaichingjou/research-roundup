# =============================================================================
# Central banks and institutions reached through aggregated feeds
# -----------------------------------------------------------------------------
# Used by two sources in sources.yaml:
#  - central_banks (OpenAlex): one query per institution below for recent
#    works by its researchers;
#  - bis_research_hub (RSS): items are attributed to the institution whose
#    domain matches the item's link (or whose RePEc code appears in it).
#
# group:   how the institution is presented in the newsletter and explorer.
# aliases: other names to try when looking the institution up in OpenAlex.
# openalex_id: the institution's OpenAlex ID. Pinned IDs skip the name search,
#          which OpenAlex bills against a small daily budget. IDs below were
#          resolved by name on 31 Oct 2026 and checked against the matched name.
# =============================================================================

institutions:
  # --- G10 central banks and the ECB ----------------------------------------
  # (The Federal Reserve Board, the US member of the G10, is fetched directly
  #  from Fed in Print together with the 12 regional banks.)
  - {id: ecb, name: European Central Bank, group: G10 central banks and ECB, openalex_id: I153515283, domains: [ecb.europa.eu], repec: [ecb]}
