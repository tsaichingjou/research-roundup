# =============================================================================
# The Research Roundup — analysis configuration
# -----------------------------------------------------------------------------
# Everything that shapes paper selection and the LLM analysis is set here.
# =============================================================================

llm:
  provider: gemini
  # Each list is tried in order: if a model is unavailable for this API key
  # (404) or repeatedly times out, the next one is used.
  #   python main.py models   -> models your key can use
  #   python main.py check    -> test each configured model and its response time
  # Screening is a simple scoring task: a fast "lite" model is enough.
  screening_models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  # The newsletter write-ups use a stronger model.
  # Order set from `python main.py check` on 30 Oct 2026: gemini-3.6-flash answered
  # in ~2s; gemini-3.8-flash was overloaded (503 / 90s timeouts), so it is a fallback.
  analysis_models:
    - gemini-3.6-flash
    - gemini-3.8-flash
    - gemini-3.5-flash-lite
  temperature: 0.2
  min_interval_seconds: 4     # spacing between calls, to stay inside free-tier RPM limits
  timeout_seconds: 90         # a model that times out or returns 5xx twice is skipped for the next one

window:
  days: 31                    # an issue covers papers first seen or published in the last N days

enrichment:                   # recover missing abstracts before excluding a paper (src/enrich.py)
  enabled: true
  openalex: true              # free scholarly index, by DOI or exact title
  landing_page: true          # abstract metadata tags on the paper's own page
  retry_after_days: 7         # a paper not found is retried a week later
  max_per_run: 300
  max_title_searches: 40      # OpenAlex bills title searches (DOI lookups are free): cap per run

prefilter:
  min_abstract_chars: 200     # papers still without a usable abstract are excluded (and logged)
  exclude_title_patterns:     # non-research items
    - "^comment on"
    - "^reply to"
    - "^a reply"
    - "^rejoinder"
    - "^erratum"
    - "^corrigendum"
    - "^correction"
    - "^retraction"
    - "^report of the"
    - "^in memoriam"
    - "^obituary"

screening:
  batch_size: 8               # papers per screening call
  max_abstract_chars: 1500    # abstracts are truncated to this length when screening

selection:
  min_papers: 5
  max_papers: 8
  min_score: 6                # out of 10
  max_per_source: 2           # keeps each issue diverse across institutions/journals
