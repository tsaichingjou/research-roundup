# =============================================================================
# The Research Roundup — source configuration
# -----------------------------------------------------------------------------
# Every publication source the agent monitors is declared here, so adding or
# removing a source never requires touching Python code.
#
# Fields
#   id        unique short key, stored with every paper
#   name      human-readable name shown in the newsletter
#   category  journal | central_bank | research_institution
#   group     heading the source is listed under in the newsletter and explorer
#   type      fetcher to use: rss | crossref | openalex
#   aggregator  rss only: the feed mixes many institutions; each item is
#               attributed using config/institutions.yaml
#   url       feed URL (rss sources)
#   issn      journal ISSN (crossref sources)
#   lookback_days  crossref: override the global look-back window
#   enabled   set to false to skip a source without deleting it
#   notes     anything worth knowing about the source
# =============================================================================

settings:
  request_timeout_seconds: 20
  max_retries: 3
  user_agent: "ResearchRoundupBot/0.1 (economic research monitoring; contact: tsaichingjouinuk@gmail.com)"
  contact_email: tsaichingjouinuk@gmail.com   # sent to Crossref for its "polite pool"
  lookback_days: 30                           # crossref: how far back each run looks
  database_path: data/papers.db

sources:
  # --- Research institutions --------------------------------------------------
  - id: nber
    name: National Bureau of Economic Research (NBER)
    category: research_institution
    group: Research institutions
    type: rss
    url: https://www.nber.org/rss/new.xml
    enabled: true
    notes: All new NBER working papers; weekly batch, usually released on Mondays.

  - id: bis
    name: Bank for International Settlements (BIS)
    category: research_institution
    group: Research institutions
    type: rss
    url: https://www.bis.org/doclist/wppubls.rss
    enabled: true
    notes: BIS Working Papers series.

  - id: imf
    name: International Monetary Fund (IMF)
    category: research_institution
    group: Research institutions
    type: crossref
    issn: 1018-5941
    enabled: true
    notes: >
      IMF Working Papers. The IMF RSS endpoint returns 404 and the publications
      search page is JavaScript-rendered, so papers are read from Crossref by
      the series ISSN instead.

  # --- Top-5 economics journals (Crossref, by print ISSN) ---------------------
  # Journals register DOIs in batches every 1-2 months (e.g. Econometrica's
  # latest batch was registered 14 Sep 2026), so they look back 90 days instead
  # of 30. Already-stored papers are skipped by the de-duplication step.
  - id: aer
    name: American Economic Review
    category: journal
    group: Top-5 economics journals
    type: crossref
    issn: 0002-8282
    lookback_days: 90
    enabled: true

  - id: ecta
    name: Econometrica
    category: journal
    group: Top-5 economics journals
    type: crossref
    issn: 0012-9682
    lookback_days: 90
    enabled: true

  - id: jpe
    name: Journal of Political Economy
    category: journal
    group: Top-5 economics journals
    type: crossref
    issn: 0022-3808
    lookback_days: 90
    enabled: true

  - id: qje
    name: Quarterly Journal of Economics
    category: journal
    group: Top-5 economics journals
    type: crossref
    issn: 0033-5533
    lookback_days: 90
    enabled: true

  - id: restud
    name: Review of Economic Studies
    category: journal
    group: Top-5 economics journals
    type: crossref
    issn: 0034-6527
    lookback_days: 90
    enabled: true

  # --- Brookings Papers on Economic Activity ---------------------------------
  # BPEA appears twice a year (spring and autumn conferences) and has no feed;
  # Crossref by ISSN returned nothing, so it is read from OpenAlex by ISSN,
  # looking back a year so each run sees the latest edition.
  - id: bpea
    name: Brookings Papers on Economic Activity (BPEA)
    category: journal
    group: Research institutions
    type: openalex
    issn: 0007-2303
    lookback_days: 365
    require_abstract: false
    enabled: true

  # --- Federal Reserve System: Board + 12 regional banks ----------------------
  # Fed in Print is the Federal Reserve System's own catalogue of its
  # publications, with one feed per bank. Feeds also carry speeches and
  # articles; items without an abstract are excluded at the analysis stage.
  - id: fed_board
    name: Board of Governors of the Federal Reserve System
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/board.rss
    enabled: true

  - id: fed_atlanta
    name: Federal Reserve Bank of Atlanta
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/atlanta.rss
    enabled: true

  - id: fed_boston
    name: Federal Reserve Bank of Boston
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/boston.rss
    enabled: true

  - id: fed_chicago
    name: Federal Reserve Bank of Chicago
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/chicago.rss
    enabled: true

  - id: fed_cleveland
    name: Federal Reserve Bank of Cleveland
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/cleveland.rss
    enabled: true

  - id: fed_dallas
    name: Federal Reserve Bank of Dallas
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/dallas.rss
    enabled: true

  - id: fed_kansascity
    name: Federal Reserve Bank of Kansas City
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/kansascity.rss
    enabled: true

  - id: fed_minneapolis
    name: Federal Reserve Bank of Minneapolis
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/minneapolis.rss
    enabled: true

  - id: fed_newyork
    name: Federal Reserve Bank of New York
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/newyork.rss
    enabled: true

  - id: fed_philadelphia
    name: Federal Reserve Bank of Philadelphia
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/philadelphia.rss
    enabled: true

  - id: fed_richmond
    name: Federal Reserve Bank of Richmond
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/richmond.rss
    enabled: true

  - id: fed_stlouis
    name: Federal Reserve Bank of St. Louis
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/stlouis.rss
    enabled: true

  - id: fed_sanfrancisco
    name: Federal Reserve Bank of San Francisco
    category: central_bank
    group: Federal Reserve System
    type: rss
    url: https://fedinprint.org/rss/sanfrancisco.rss
    enabled: true

  # --- G10 central banks + ECB, European and other central banks -------------
  # One OpenAlex query per central bank in config/institutions.yaml: recent
  # works by that bank's researchers, with abstracts. Chosen over scraping ~50
  # differently built websites; the BIS Research Hub feed (below) carried only a
  # few items and lagged by months when tested on 31 Oct 2026.
  - id: central_banks
    name: Central banks (via OpenAlex)
    category: central_bank
    group: Central banks (via OpenAlex)
    type: openalex
    institutions: true
    include_groups: [G10 central banks and ECB, European national central banks, Other central banks]
    lookback_days: 60
    per_institution: 25
    enabled: true

  # Supplementary: the BIS Central Bank Research Hub republishes central-bank
  # research in one feed, each item attributed to its bank from the link domain.
  - id: bis_research_hub
    name: BIS Central Bank Research Hub
    category: central_bank
    group: Central banks (via BIS Research Hub)
    type: rss
    url: https://www.bis.org/doclist/reshub_papers.rss
    aggregator: true
    enabled: true
